# Dev Container overlay. Layered on top of the repo's ../docker-compose.yml so
# the dev environment reuses the exact same db / db-test / redis services the
# app talks to in normal local development.
services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/rust:1-bookworm
    # Keep the container alive; the developer runs cargo commands inside it.
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      # Shadow the bind-mounted ./target with a named volume: the host's
      # target/ holds macOS build artifacts that are useless (and harmful) to a
      # Linux toolchain. A dedicated volume keeps Linux builds fast and isolated.
      - target-cache:/workspace/target
      # Persist downloaded crates across rebuilds.
      - cargo-registry:/usr/local/cargo/registry
    environment:
      # Inside the compose network the DB/cache are reachable by service name.
      DATABASE_URL: postgres://db_user_test:12345@db:5432/tulsi_test_db
      TEST_DATABASE_URL: postgres://db_user_test:12345@db-test:5432/tulsi_test_db_test
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me
    depends_on:
      - db
      - db-test
      - redis

volumes:
  target-cache:
  cargo-registry:
